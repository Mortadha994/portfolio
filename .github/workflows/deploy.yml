name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without a new commit.
  workflow_dispatch:

concurrency:
  # A newer push supersedes one still deploying.
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci needs the lockfile to match package.json exactly, which is
      # what makes the CI build reproducible.
      - run: npm ci

      - run: npm run build

      # Fails the deploy rather than shipping an empty site.
      - name: Check the build produced a page
        run: test -s dist/index.html && test -f dist/_headers

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mortadha --branch=main
